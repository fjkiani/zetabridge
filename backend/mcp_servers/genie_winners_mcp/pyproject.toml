[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-winners-mcp"
version = "0.1.0"
description = "GENIE data plane + Winners decision plane MCP (zetabridge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = []
data = [
    "duckdb>=0.9.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
genie-winners-mcp = "genie_winners_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["genie_winners_mcp*"]
