services:
  - type: web
    name: zetabridge-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
    plan: free
    healthCheckPath: /api/health
