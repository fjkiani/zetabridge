# Render Blueprint for ZetaBridge
# API + Postgres + Static Dashboard

databases:
  - name: zetabridge-pg
    databaseName: zetabridge
    user: zetabridge
    plan: free

services:
  - type: web
    name: zetabridge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: USE_LEGACY_STORE
        value: "1"
      - key: HF_TEXT2SQL_MODEL
        value: Snowflake/Arctic-Text2SQL-R1-7B
      - key: DATABASE_URL
        fromDatabase:
          name: zetabridge-pg
          property: connectionString
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_SCHEMA
        sync: false
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_HTTP_PATH
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_CATALOG
        sync: false
      - key: DATABRICKS_SCHEMA
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GRAVITINO_URL
        sync: false
      - key: MARQUEZ_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

      # --- Federated graph + agent access (Sessions 12–14) ---
      # Neo4j Aura holds the pre-extracted federated KG (read-only over the API).
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # The ONE scoped key external agents send as X-Zeta-Api-Key. Closed by
      # default: with this unset, /api/graph, /api/signals and /api/sources
      # all return 503.
      - key: ZETA_GRAPH_API_KEY
        sync: false
      # Optional Groq narration for the signal agents (never invents numbers).
      - key: GROQ_API_KEY
        sync: false

      # --- Live source extraction (Session 15) ---
      # SERVER-SIDE ONLY. Values are set as Render dashboard secrets (sync:false),
      # never committed. Leave any unset => that source reports "unconfigured"
      # (honest, not an error). EGA metadata is public and needs no token.
      - key: SYNAPSE_AUTH_TOKEN
        sync: false
      - key: SAS_CAS_HOST
        value: "mpmprodvdmml.ondemand.sas.com"
      - key: SAS_CAS_PORT
        value: "443"
      - key: SAS_CAS_PROTOCOL
        value: "https"
      - key: SAS_CAS_TOKEN
        sync: false
      - key: SAS_CAS_USER
        sync: false
      - key: SAS_CAS_PASSWORD
        sync: false
      - key: SAS_CAS_CADATA
        sync: false
      - key: EGA_USERNAME
        sync: false
      - key: EGA_PASSWORD
        sync: false
      - key: EGA_DEFAULT_DATASET
        value: "EGAD00001011049"
      # D_ARGO — ICGC ARGO / Overture SONG+SCORE (DACO controlled genomics).
      # Token is a Render secret (sync:false), already set in the dashboard.
      # Bytes stream direct from the object host; never proxied through the dyno.
      - key: ICGC_ARGO_TOKEN
        sync: false
      - key: ICGC_ARGO_API_BASE
        value: "https://api.platform.icgc-argo.org"
      - key: ICGC_ARGO_OBJECT_HOST
        value: "object.genomeinformatics.org"

  # Monorepo uses pnpm `catalog:` in package.json — build from repo root (no rootDir).
  - type: web
    name: zetabridge-ui
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm --filter @workspace/zetabridge run build
    staticPublishPath: artifacts/zetabridge/dist/public
    envVars:
      - key: VITE_API_BASE
        value: "https://zetabridge-api.onrender.com"
      # Scoped graph API key the browser sends as X-Zeta-Api-Key. Set as a
      # Render secret (sync:false). Required for the live /live console and the
      # two chat copilots; data browsing falls back to the bundled snapshot.
      - key: VITE_ZETA_API_KEY
        sync: false
