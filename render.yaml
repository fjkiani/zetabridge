# Render Blueprint for ZetaBridge
# API + Postgres + Static Dashboard

databases:
  - name: zetabridge-pg
    databaseName: zetabridge
    user: zetabridge
    plan: free

services:
  - type: web
    name: zetabridge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: USE_LEGACY_STORE
        value: "1"
      - key: HF_TEXT2SQL_MODEL
        value: Snowflake/Arctic-Text2SQL-R1-7B
      - key: DATABASE_URL
        fromDatabase:
          name: zetabridge-pg
          property: connectionString
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PASSWORD
        sync: false
      - key: SNOWFLAKE_WAREHOUSE
        sync: false
      - key: SNOWFLAKE_DATABASE
        sync: false
      - key: SNOWFLAKE_SCHEMA
        sync: false
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_HTTP_PATH
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false
      - key: DATABRICKS_CATALOG
        sync: false
      - key: DATABRICKS_SCHEMA
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: GRAVITINO_URL
        sync: false
      - key: MARQUEZ_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Monorepo uses pnpm `catalog:` in package.json — build from repo root (no rootDir).
  - type: web
    name: zetabridge-ui
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm --filter @workspace/zetabridge run build
    staticPublishPath: artifacts/zetabridge/dist/public
    envVars:
      - key: VITE_API_BASE
        value: "https://zetabridge-api.onrender.com"
