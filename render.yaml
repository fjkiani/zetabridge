# Render Blueprint for ZetaBridge substrate
# Single Python web service + embedded DuckDB + embedded SQLite lineage store.
# No managed Postgres. No Gravitino. No Marquez. No Snowflake/Databricks.
#
# Disk: starter plan required for persistent DuckDB and SQLite files.
# Set DUCKDB_PATH and LINEAGE_DB_PATH to paths under /var/data/ (Render persistent disk).

services:
  - type: web
    name: zetabridge-substrate
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: starter
    disk:
      name: zetabridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DUCKDB_PATH
        value: /var/data/biotech.duckdb
      - key: LINEAGE_DB_PATH
        value: /var/data/lineage.sqlite
      - key: CORS_ORIGINS
        value: '["https://zetabridge-ui.onrender.com"]'
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Set these in Render dashboard — do not commit values
      - key: GROQ_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: HF_TEXT2SQL_MODEL
        value: Snowflake/Arctic-Text2SQL-R1-7B

  - type: web
    name: zetabridge-ui
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm --filter @workspace/zetabridge run build
    staticPublishPath: artifacts/zetabridge/dist/public
    envVars:
      - key: VITE_API_BASE
        value: "https://zetabridge-substrate.onrender.com"
